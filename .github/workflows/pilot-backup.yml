name: Pilot backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Create database and storage backup
        run: npm run backup:pilot
        env:
          SUPABASE_CLI: supabase
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Verify backup checksums
        run: npm run backup:verify -- "$(find backups -name manifest.json -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: stavba-pilot-backup-${{ github.run_id }}
          path: backups/
          retention-days: 14
          if-no-files-found: error
