name: Pilot backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Link Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Create database and storage backup
        run: npm run backup:pilot
        env:
          BACKUP_USE_LINKED: "1"
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Verify backup checksums
        run: npm run backup:verify -- "$(find backups -name manifest.json -print -quit)"
      - uses: actions/upload-artifact@v6
        with:
          name: stavba-pilot-backup-${{ github.run_id }}
          path: backups/
          # Daily backups grow quickly on the free Actions storage allowance.
          # Three rolling copies are enough alongside Supabase's own storage.
          retention-days: 3
          if-no-files-found: error
