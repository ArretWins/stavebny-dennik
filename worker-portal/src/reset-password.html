<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Obnova hesla · Stavuno</title>
    <link rel="stylesheet" href="/reset-password.css" />
  </head>
  <body>
    <main class="shell">
      <a class="brand" href="/" aria-label="Stavuno — domov">
        <img src="/assets/app-icon.png" alt="" />
        <span><strong>Stavuno</strong><small>Stavba pod kontrolou.</small></span>
      </a>

      <section class="card" aria-labelledby="recovery-title">
        <div class="language" role="group" aria-label="Jazyk">
          <button type="button" data-language="sk">SK</button>
          <button type="button" data-language="uk">UA</button>
          <button type="button" data-language="ru">RU</button>
        </div>
        <p class="eyebrow" data-copy="eyebrow">OBNOVA ÚČTU</p>
        <h1 id="recovery-title" data-copy="title">Vytvorte si nové heslo</h1>
        <p class="intro" data-copy="intro">Zadajte nové heslo pre svoj účet Stavuno.</p>

        <div id="loading" class="status" data-copy="checking">Kontrolujem odkaz na obnovu…</div>
        <div id="error" class="status error hidden" role="alert"></div>
        <div id="success" class="status success hidden" role="status">
          <strong data-copy="successTitle">Heslo bolo zmenené.</strong>
          <span data-copy="successText">Teraz sa môžete prihlásiť v aplikácii Stavuno.</span>
          <a href="stavebnydennik://" data-copy="openApp">Otvoriť aplikáciu</a>
        </div>

        <form id="recovery-form" class="hidden">
          <label for="password" data-copy="password">Nové heslo</label>
          <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required />
          <label for="confirmation" data-copy="confirmation">Zopakujte nové heslo</label>
          <input id="confirmation" name="confirmation" type="password" minlength="6" autocomplete="new-password" required />
          <p class="hint" data-copy="hint">Použite aspoň 6 znakov.</p>
          <button id="submit" type="submit" data-copy="submit">Uložiť nové heslo</button>
        </form>
      </section>
    </main>
    <script src="/config.js"></script>
    <script type="module" src="/reset-password.js"></script>
  </body>
</html>
